name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # nötig, um Releases anzulegen

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Music-os.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Music-os-apk
          path: Music-os.apk

      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          NOTES="$(git log -1 --pretty=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:')"
          gh release create "v$VERSION" Music-os.apk \
            --target "$GITHUB_SHA" \
            --title "Music-os $VERSION" \
            --notes "$NOTES" \
            --latest
